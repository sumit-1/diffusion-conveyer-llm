model:
  vocab_size: 4096
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 1408
  max_seq_len: 512
  dropout: 0.0
  belt_size: 96
  front_conveyer_slots: 5
  duplex_k_slots: 4
  plan_horizon_stride: 2
  tau_min: 0.5
  tau_max: 1.5
  tau_gamma: 1.25
  gate_bias_init: 1.0
  spawn_noise_std: 0.5
  thought_noise_std: 0.25
  use_thought_highway: true
  use_elastic_planning: true
  use_thought_reservoir: true
  use_duplex_frame: true
  causal_belt_only: false
  grad_checkpointing: false

train:
  out_dir: "runs/tinystories"
  seed: 42
  batch_size: 16
  lr: 0.0005
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 200000
  max_hours: 24.0
  warmup_steps: 1500
  eval_every: 500
  save_every: 500
  log_every: 50
  unroll_steps: 16
  prefix_lm_weight: 1.0
  step_cooldown_ms: 40
  max_gpu_temp_c: 78
  seed_sigma_max: 3.5
  seed_sigma_eta: 1.25
  recovery_prob: 0.35
  belt_corrupt_prob: 0.20
  loss_w_min: 0.05
  loss_w_beta: 1.5
  entropy_reg: 0.001
  no_belt_bptt: false
  no_thought_highway: false
  ar_baseline: false

infer:
  prompt_overlap: 12
  bake_steps: 96
  temperature: 0.0
  max_new_tokens: 64

data:
  dataset: "tinystories"
  task: "lm"
  seq_len: 256
  num_train: 2000000
  num_val: 10000
  data_dir: "data/tinystories"
  vocab_size: 4096
